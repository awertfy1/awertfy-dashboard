<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e1140c" />
  <meta name="robots" content="noindex" />
  <title>404 — awertfy</title>
  <meta property="og:title" content="awertfy" />
  <meta property="og:image" content="https://awertfy.ru/og.jpg" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e1140c'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='%23efe9df'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%230a0909'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --red: #e1140c;
      --red-deep: #a80c06;
      --black: #0a0909;
      --bone: #efe9df;
      --disp: "Unbounded", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --pad: clamp(1.1rem, 4vw, 2.25rem);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--red);
      color: var(--black);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    a { color: inherit; text-decoration: none; }

    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.2rem, 4vh, 2rem);
      padding: calc(var(--pad) + var(--safe-t)) var(--pad) calc(var(--pad) + var(--safe-b));
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(120% 80% at 50% 50%, transparent 40%, rgba(80, 0, 0, 0.35) 100%);
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: -10%;
      z-index: 5;
      opacity: 0.16;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E");
      animation: grain 0.9s steps(4) infinite;
    }

    @keyframes grain {
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, -1%); }
    }

    .corner {
      position: absolute;
      font-family: var(--disp);
      font-weight: 800;
      font-size: clamp(2.2rem, 8vw, 6rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      opacity: 0;
      animation: stamp 0.7s var(--ease) forwards;
    }

    .tl { top: calc(var(--pad) + var(--safe-t)); left: var(--pad); animation-delay: 0.1s; }
    .tr { top: calc(var(--pad) + var(--safe-t)); right: var(--pad); animation-delay: 0.2s; }
    .bl { bottom: calc(var(--pad) + var(--safe-b)); left: var(--pad); animation-delay: 0.3s; }
    .br { bottom: calc(var(--pad) + var(--safe-b)); right: var(--pad); animation-delay: 0.4s; }

    @keyframes stamp {
      0% { opacity: 0; transform: scale(2.2) rotate(-6deg); filter: blur(6px); }
      55% { opacity: 1; transform: scale(0.94); filter: none; }
      100% { opacity: 1; transform: none; }
    }

    .sun {
      --s: min(62vmin, 440px);
      position: relative;
      width: var(--s);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--bone);
      display: grid;
      place-items: center;
      clip-path: circle(0% at 50% 50%);
      animation: open 1.1s cubic-bezier(0.76, 0, 0.24, 1) 0.1s forwards;
      transform: translate3d(var(--px, 0px), var(--py, 0px), 0);
    }

    @keyframes open { to { clip-path: circle(50% at 50% 50%); } }

    .dial {
      position: absolute;
      inset: 3.5%;
      border-radius: 50%;
      background: repeating-conic-gradient(var(--black) 0deg 0.8deg, transparent 0.8deg 6deg);
      -webkit-mask: radial-gradient(circle closest-side, transparent 0 calc(100% - 14px), #000 calc(100% - 13px) 100%, transparent 100%);
      mask: radial-gradient(circle closest-side, transparent 0 calc(100% - 14px), #000 calc(100% - 13px) 100%, transparent 100%);
      animation: spin 50s linear infinite;
    }

    .dial::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(from -1.5deg, var(--red) 0deg 3deg, transparent 3deg 90deg);
      -webkit-mask: radial-gradient(circle closest-side, transparent 0 calc(100% - 26px), #000 calc(100% - 25px) 100%, transparent 100%);
      mask: radial-gradient(circle closest-side, transparent 0 calc(100% - 26px), #000 calc(100% - 25px) 100%, transparent 100%);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .code {
      position: relative;
      font-family: var(--disp);
      font-weight: 800;
      font-size: calc(var(--s) * 0.3);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .code::before,
    .code::after {
      content: "404";
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .code::before { color: var(--red); animation: glitch-a 4s steps(1) 1.4s infinite; }
    .code::after { color: var(--red-deep); animation: glitch-b 4s steps(1) 1.4s infinite; }

    @keyframes glitch-a {
      0%, 88%, 100% { opacity: 0; transform: none; clip-path: none; }
      90% { opacity: 1; transform: translate(-6px, 2px); clip-path: inset(10% 0 55% 0); }
      93% { opacity: 1; transform: translate(6px, -2px); clip-path: inset(60% 0 8% 0); }
    }

    @keyframes glitch-b {
      0%, 89%, 100% { opacity: 0; transform: none; clip-path: none; }
      91% { opacity: 1; transform: translate(5px, 2px); clip-path: inset(40% 0 25% 0); }
      94% { opacity: 1; transform: translate(-4px, -1px); clip-path: inset(5% 0 70% 0); }
    }

    .msg {
      margin: 0;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: rise 0.9s var(--ease) 0.8s forwards;
    }

    .back {
      display: inline-flex;
      align-items: stretch;
      background: var(--black);
      color: var(--bone);
      opacity: 0;
      animation: rise 0.9s var(--ease) 1s forwards;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .back::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--bone);
      transform: scaleX(0);
      transform-origin: 0 50%;
      transition: transform 0.5s var(--ease);
    }

    .back span {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 0 1.2rem;
      font-family: var(--disp);
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.4s var(--ease);
    }

    .back i {
      display: grid;
      place-items: center;
      width: 48px;
      font-style: normal;
      background: var(--red-deep);
      transition: background 0.4s var(--ease);
    }

    @media (hover: hover) {
      .back:hover::before { transform: scaleX(1); }
      .back:hover span { color: var(--black); }
      .back:hover i { background: var(--black); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }

    .stamp-mark {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      font-family: var(--disp);
      font-weight: 800;
      font-size: clamp(2rem, 6vw, 3.4rem);
      transform: translate(-50%, -50%) rotate(var(--r)) scale(2);
      opacity: 0;
      animation: hit 2.2s var(--ease) forwards;
    }

    @keyframes hit {
      12% { opacity: 0.9; transform: translate(-50%, -50%) rotate(var(--r)) scale(1); }
      70% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--r)) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      .code::before, .code::after, .grain { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="stage" id="stage">
    <span class="corner tl" aria-hidden="true">AW</span>
    <span class="corner tr" aria-hidden="true">ER</span>
    <span class="corner bl" aria-hidden="true">TF</span>
    <span class="corner br" aria-hidden="true">Y</span>

    <div class="sun" id="sun">
      <div class="dial" aria-hidden="true"></div>
      <h1 class="code">404</h1>
    </div>

    <p class="msg">this page went partisan</p>

    <a class="back" href="/"><span>back home</span><i aria-hidden="true">←</i></a>
  </main>

  <script>
    (function () {
      var stage = document.getElementById("stage");
      var sun = document.getElementById("sun");
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) return;
      var SYMBOLS = ["✦", "●", "✕", "▲", "■"];
      stage.addEventListener("pointerdown", function (e) {
        if (e.target.closest("a")) return;
        var el = document.createElement("span");
        el.className = "stamp-mark";
        el.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
        el.style.left = e.clientX + "px";
        el.style.top = e.clientY + "px";
        el.style.setProperty("--r", (Math.random() * 40 - 20).toFixed(1) + "deg");
        stage.appendChild(el);
        setTimeout(function () { el.remove(); }, 2300);
      });
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
        window.addEventListener("pointermove", function (e) {
          var x = (e.clientX / innerWidth - 0.5) * 24;
          var y = (e.clientY / innerHeight - 0.5) * 18;
          sun.style.setProperty("--px", x.toFixed(1) + "px");
          sun.style.setProperty("--py", y.toFixed(1) + "px");
        });
      }
    })();
  </script>
</body>
</html>
