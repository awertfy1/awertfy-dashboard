<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awertfy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <p class="top-greeting">welcome</p>

    <header class="profile-header">
      <div class="banner">
        <img src="assets/banner-mountain.jpg" alt="" class="banner-img" width="1024" height="682" />
      </div>
      <img src="assets/avatar.png" alt="" class="avatar" width="88" height="88" />
    </header>

    <h1 class="username"><span class="pipe">|</span>awertfy</h1>

    <blockquote class="quote">
      <p class="quote-text"><span id="quote-text"></span><span class="quote-cursor" aria-hidden="true">|</span></p>
      <cite class="quote-author" id="quote-author"></cite>
    </blockquote>

    <main class="grid">
      <section class="col col-left">
        <div class="counter" id="counter" aria-live="polite">
          <div class="counter-unit">
            <span class="counter-value" id="months">0</span>
            <span class="counter-label">months</span>
          </div>
          <div class="counter-unit">
            <span class="counter-value" id="days">0</span>
            <span class="counter-label">days</span>
          </div>
          <div class="counter-unit">
            <span class="counter-value" id="minutes">0</span>
            <span class="counter-label">minutes</span>
          </div>
          <div class="counter-unit">
            <span class="counter-value" id="seconds">0</span>
            <span class="counter-label">seconds</span>
          </div>
        </div>

        <div class="links-grid">
          <div class="link-item"><a href="https://t.me/awertfy" target="_blank" rel="noopener noreferrer"><span class="bar">|</span> telegram @awertfy</a></div>
          <div class="link-item"><span class="bar">|</span> balance : 15$</div>
          <div class="link-item"><a href="https://music.yandex.ru/playlists/lk.5f6472e1-83b2-4dea-b396-37c7a08ac667?utm_source=desktop&utm_medium=copy_link" target="_blank" rel="noopener noreferrer"><span class="bar">|</span> music</a></div>
          <div class="link-item link-secondary"><span class="bar">|</span> happiness</div>
          <div class="link-item link-secondary"><span class="bar">|</span> aspiration</div>
          <div class="link-item link-secondary"><span class="bar">|</span> search</div>
        </div>

        <div class="todo-block">
          <h2 class="section-title"><span class="bar">|</span> things to do</h2>
          <ul class="todo-list">
            <li class="todo-item done">
              <span class="checkbox checked" aria-hidden="true"></span>
              <span class="todo-text">study</span>
            </li>
            <li class="todo-item">
              <span class="checkbox" aria-hidden="true"></span>
              <span class="todo-text">clean room</span>
            </li>
            <li class="todo-item">
              <span class="checkbox" aria-hidden="true"></span>
              <span class="todo-text">work</span>
            </li>
            <li class="todo-item">
              <span class="checkbox" aria-hidden="true"></span>
              <span class="todo-text">driving</span>
            </li>
          </ul>
        </div>

        <div class="progress-group">
          <div class="progress-row">
            <div class="progress-track">
              <div class="progress-fill" id="year-fill"></div>
            </div>
            <span class="progress-label" id="year-label">Year: 0%</span>
          </div>
          <div class="progress-row">
            <div class="progress-track">
              <div class="progress-fill" id="day-fill"></div>
            </div>
            <span class="progress-label" id="day-label">Day: 0 / 29220</span>
          </div>
        </div>
      </section>

      <section class="col col-right">
        <figure class="side-photo">
          <img src="assets/bottom.png" alt="" width="320" height="480" />
        </figure>
      </section>
    </main>
  </div>
  <script src="js/main.js" defer></script>
</body>
</html>
