<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>awertfy</title>
  <meta name="description" content="awertfy — personal space." />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo" href="/">awertfy<span>®</span></a>
    <nav class="nav" aria-label="Sections">
      <a href="#bio" data-scroll="bio">bio</a>
    </nav>
    <a class="top-cta" href="https://t.me/awertfy" target="_blank" rel="noopener noreferrer">telegram</a>
  </header>

  <section class="hero" aria-label="Hero">
    <div class="hero-copy">
      <h1 class="visually-hidden">awertfy</h1>
      <p class="eyebrow reveal">welcome</p>
      <p class="lede reveal">
        Personal space for study, work, movement — and whatever comes next.
      </p>
    </div>

    <figure class="hero-visual reveal">
      <img src="assets/hero-dither.png" alt="" width="1024" height="690" />
    </figure>

    <a class="create-chip reveal" href="https://t.me/awertfy" target="_blank" rel="noopener noreferrer">
      <span>What will you create?</span>
      <span class="create-mark" aria-hidden="true"></span>
    </a>
  </section>

  <main class="page">
    <section class="bio" id="bio">
      <div class="bio-grid">
        <div class="bio-col">
          <p><span class="muted">birthday:</span> 22.11</p>
          <p>
            <span class="muted">balance:</span>
            $<span class="balance-slot"><span class="balance-reel" id="balance-reel"><span class="balance-num">15</span></span></span>
          </p>
          <p class="quote-block">
            <span id="quote-text"></span><span class="quote-cursor" aria-hidden="true">|</span>
            <br />
            <span class="quote-author" id="quote-author"></span><span class="quote-cursor author-cursor" aria-hidden="true">|</span>
          </p>
        </div>

        <div class="bio-col links">
          <a href="https://music.yandex.ru/playlists/lk.5f6472e1-83b2-4dea-b396-37c7a08ac667?utm_source=desktop&utm_medium=copy_link" target="_blank" rel="noopener noreferrer">Music</a>
          <a href="https://pin.it/2qXwwrw3d" target="_blank" rel="noopener noreferrer">Pinterest</a>
        </div>
      </div>

      <div class="counter" id="counter" aria-live="polite">
        <div class="counter-unit">
          <span class="counter-value" id="months">0</span>
          <span class="counter-label">months</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" id="days">0</span>
          <span class="counter-label">days</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" id="minutes">0</span>
          <span class="counter-label">minutes</span>
        </div>
        <div class="counter-unit">
          <span class="counter-value" id="seconds">0</span>
          <span class="counter-label">seconds</span>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
